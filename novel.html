<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Novel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@300;400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #191919;
    --ink: #e8e4dc;
    --dim: #6f6b64;
    --line: #2c2c2c;
    --danger: #c0453c;
    --ok: #4b8b6f;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    padding: 10px 16px 0;
  }
  .bar {
    max-width: 780px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 12.5px;
    color: var(--dim);
    letter-spacing: 0.02em;
  }
  .count { font-variant-numeric: tabular-nums; }
  .spacer { flex: 1; }

  .fmt {
    background: none;
    border: 1px solid var(--line);
    color: var(--dim);
    border-radius: 5px;
    width: 26px;
    height: 24px;
    cursor: pointer;
    font-family: Spectral, serif;
    font-size: 13px;
    line-height: 1;
  }
  .fmt:hover { color: var(--ink); border-color: #3d3d3d; }
  .fmt.b { font-weight: 600; }
  .fmt.i { font-style: italic; }

  .death { display: flex; align-items: center; gap: 7px; cursor: pointer; user-select: none; }
  .death input { display: none; }
  .switch {
    width: 30px; height: 16px;
    border-radius: 9px;
    border: 1px solid var(--line);
    background: #222;
    position: relative;
    transition: background .15s, border-color .15s;
  }
  .switch::after {
    content: "";
    position: absolute;
    top: 2px; left: 2px;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--dim);
    transition: transform .15s, background .15s;
  }
  .death.on .switch { background: rgba(192,69,60,.25); border-color: var(--danger); }
  .death.on .switch::after { transform: translateX(14px); background: var(--danger); }
  .death.on .label { color: var(--danger); }

  .save {
    background: none;
    border: 1px solid var(--line);
    color: var(--dim);
    border-radius: 5px;
    padding: 4px 12px;
    cursor: pointer;
    font-family: inherit;
    font-size: 12.5px;
  }
  .save:hover { color: var(--ink); border-color: #3d3d3d; }
  .save:disabled { opacity: .4; cursor: default; }

  .chip {
    display: none;
    align-items: center;
    gap: 6px;
    padding: 2px 4px 2px 9px;
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--ok);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .chip.on { display: inline-flex; }
  .chip button {
    background: none;
    border: 0;
    color: var(--dim);
    cursor: pointer;
    font: inherit;
    line-height: 1;
    padding: 2px 5px;
  }
  .chip button:hover { color: var(--ink); }

  .sheet {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: none;
    align-items: flex-start;
    justify-content: center;
    padding: 12vh 16px 16px;
    background: rgba(12, 12, 12, .72);
  }
  .sheet.on { display: flex; }
  .sheet-card {
    width: 100%;
    max-width: 460px;
    max-height: 70vh;
    display: flex;
    flex-direction: column;
    background: #1d1d1d;
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
  }
  .sheet-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--line);
    font-size: 12.5px;
    color: var(--dim);
  }
  .sheet-list { overflow-y: auto; }
  .entry {
    display: flex;
    align-items: baseline;
    gap: 10px;
    width: 100%;
    padding: 11px 14px;
    background: none;
    border: 0;
    border-bottom: 1px solid #232323;
    color: var(--ink);
    font: inherit;
    font-size: 13.5px;
    text-align: left;
    cursor: pointer;
  }
  .entry:hover { background: #232323; }
  .entry .when { font-variant-numeric: tabular-nums; }
  .entry .n { margin-left: auto; color: var(--dim); font-size: 12px; }
  .entry .edited { color: var(--dim); font-size: 11.5px; }
  .sheet-empty { padding: 18px 14px; color: var(--dim); font-size: 13px; }

  .fuse {
    max-width: 780px;
    margin: 8px auto 0;
    height: 1px;
    background: transparent;
  }
  .fuse span {
    display: block;
    height: 100%;
    width: 0;
    background: var(--danger);
  }

  main { flex: 1; overflow-y: auto; }
  #editor {
    max-width: 780px;
    margin: 0 auto;
    padding: 46px 16px 40vh;
    min-height: 100%;
    outline: none;
    font-family: Spectral, Georgia, serif;
    font-weight: 300;
    font-size: 19px;
    line-height: 1.75;
    caret-color: var(--ink);
  }
  #editor p { margin: 0 0 1.05em; }
  /* Chrome only reports text as bold at weight >= 600, so anything lighter
     here would make Ctrl+B a one-way trip. */
  #editor strong, #editor b { font-weight: 600; color: #fff; }
  #editor h1, #editor h2, #editor h3 {
    font-weight: 500;
    color: #fff;
    line-height: 1.3;
    margin: 1.4em 0 .5em;
  }
  #editor h1 { font-size: 1.6em; }
  #editor h2 { font-size: 1.32em; }
  #editor h3 { font-size: 1.12em; color: var(--ink); }
  #editor > :first-child { margin-top: 0; }
  #editor:empty::before {
    content: attr(data-placeholder);
    color: #3a3a3a;
  }
  body.dying #editor { color: #8e6a66; transition: color .3s; }

  footer {
    border-top: 1px solid var(--line);
    padding: 8px 16px;
    min-height: 33px;
  }
  .status {
    max-width: 780px;
    margin: 0 auto;
    font-size: 12px;
    color: var(--dim);
  }
  .status.err { color: var(--danger); }
  .status.ok { color: var(--ok); }

  @media (max-width: 560px) {
    #editor { font-size: 18px; padding-top: 30px; }
    .bar { gap: 10px; font-size: 12px; }
  }
</style>
</head>
<body>

<header>
  <div class="bar">
    <span class="count" id="count">0 words</span>
    <button class="fmt b" id="bold" title="Bold (Ctrl+B)">B</button>
    <button class="fmt i" id="italic" title="Italic (Ctrl+I)">I</button>
    <span class="chip" id="chip">
      <span id="chipName"></span>
      <button type="button" id="chipClose" title="Close this entry and start fresh">×</button>
    </span>
    <span class="spacer"></span>
    <button class="save" id="entries">Entries</button>
    <label class="death" id="deathToggle">
      <input type="checkbox" id="death">
      <span class="switch"></span>
      <span class="label">instant death</span>
    </label>
    <button class="save" id="save">Save</button>
  </div>
  <div class="fuse"><span id="fuse"></span></div>
</header>

<div class="sheet" id="sheet">
  <div class="sheet-card">
    <div class="sheet-head">
      <span id="sheetTitle">Previous sessions</span>
      <span class="spacer"></span>
      <button class="save" id="sheetClose">Close</button>
    </div>
    <div class="sheet-list" id="sheetList"></div>
  </div>
</div>

<main>
  <div id="editor" contenteditable="true" spellcheck="true" data-placeholder="Begin."></div>
</main>

<footer><div class="status" id="status"></div></footer>

<script>
(function () {
  "use strict";

  var API = "https://novel.szfg2.tech";
  var DEATH_MS = 5000;
  var DRAFT_KEY = "novel.draft";
  var TOKEN_KEY = "novel.token";

  // The entry currently open for editing, or null for a fresh session.
  var current = null;

  var editor = document.getElementById("editor");
  var countEl = document.getElementById("count");
  var statusEl = document.getElementById("status");
  var saveBtn = document.getElementById("save");
  var deathBox = document.getElementById("death");
  var deathToggle = document.getElementById("deathToggle");
  var fuse = document.getElementById("fuse");
  var chip = document.getElementById("chip");
  var chipName = document.getElementById("chipName");
  var sheet = document.getElementById("sheet");
  var sheetList = document.getElementById("sheetList");

  try { document.execCommand("defaultParagraphSeparator", false, "p"); } catch (e) {}
  // Emit <b>/<i>/<h2> tags rather than inline styles, so the Markdown
  // conversion has real tags to read.
  try { document.execCommand("styleWithCSS", false, false); } catch (e) {}

  function store(key, value) {
    try { value === null ? localStorage.removeItem(key) : localStorage.setItem(key, value); } catch (e) {}
  }
  function recall(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }

  function say(text, kind) {
    statusEl.textContent = text;
    statusEl.className = "status" + (kind ? " " + kind : "");
  }

  /* ---------- word count ---------- */

  function words() {
    var text = editor.innerText.replace(/ /g, " ");
    var m = text.match(/\S+/g);
    return m ? m.length : 0;
  }

  function paintCount() {
    var n = words();
    countEl.textContent = n + (n === 1 ? " word" : " words");
  }

  /* ---------- markdown ---------- */

  function inline(node) {
    if (node.nodeType === 3) return node.nodeValue.replace(/ /g, " ");
    if (node.nodeType !== 1) return "";

    var tag = node.tagName;
    if (tag === "BR") return "\n";

    var inner = "";
    for (var i = 0; i < node.childNodes.length; i++) inner += inline(node.childNodes[i]);
    if (!inner.trim()) return inner;

    var style = node.style || {};
    if (tag === "B" || tag === "STRONG" || /^(bold|[5-9]00)$/.test(style.fontWeight || "")) return "**" + inner + "**";
    if (tag === "I" || tag === "EM" || style.fontStyle === "italic") return "*" + inner + "*";
    return inner;
  }

  function markdown() {
    var blocks = [];
    var loose = "";

    function flush() {
      if (loose.trim()) blocks.push(loose.trim());
      loose = "";
    }

    var children = editor.childNodes;
    for (var i = 0; i < children.length; i++) {
      var node = children[i];
      var isBlock = node.nodeType === 1 && /^(P|DIV|H[1-6]|BLOCKQUOTE|LI|UL|OL|PRE)$/.test(node.tagName);
      if (isBlock) {
        flush();
        var text = inline(node).trim();
        if (text) {
          var h = /^H([1-6])$/.exec(node.tagName);
          if (h) text = new Array(Number(h[1]) + 1).join("#") + " " + text;
          blocks.push(text);
        }
      } else {
        loose += inline(node);
      }
    }
    flush();

    return blocks.join("\n\n").replace(/\n{3,}/g, "\n\n").trim();
  }

  /* ---------- markdown back into the editor ---------- */

  function esc(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function inlineHtml(s) {
    return esc(s)
      .replace(/\*\*\*([^*]+)\*\*\*/g, "<b><i>$1</i></b>")
      .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
      .replace(/\*([^*]+)\*/g, "<i>$1</i>");
  }

  function toHtml(md) {
    return md.replace(/\r\n/g, "\n").split(/\n{2,}/).map(function (block) {
      block = block.trim();
      if (!block) return "";
      var h = /^(#{1,6})\s+([\s\S]*)$/.exec(block);
      if (h) {
        var level = Math.min(h[1].length, 3);
        return "<h" + level + ">" + inlineHtml(h[2].trim()) + "</h" + level + ">";
      }
      return "<p>" + inlineHtml(block).replace(/\n/g, "<br>") + "</p>";
    }).join("");
  }

  /* ---------- instant death ---------- */

  var armed = false;
  var lastKeystroke = 0;
  var frame = null;

  function tick() {
    if (!armed) return;

    if (words() === 0) {
      lastKeystroke = Date.now();
      fuse.style.width = "0";
      document.body.classList.remove("dying");
      frame = requestAnimationFrame(tick);
      return;
    }

    var left = DEATH_MS - (Date.now() - lastKeystroke);
    if (left <= 0) { kill(); return; }

    fuse.style.width = (100 - (left / DEATH_MS) * 100).toFixed(1) + "%";
    document.body.classList.toggle("dying", left < 1500);
    frame = requestAnimationFrame(tick);
  }

  function kill() {
    var lost = words();
    editor.innerHTML = "";
    store(DRAFT_KEY, null);
    fuse.style.width = "0";
    document.body.classList.remove("dying");
    paintCount();
    lastKeystroke = Date.now();
    say(lost + (lost === 1 ? " word" : " words") + " gone. Keep going.", "err");
    frame = requestAnimationFrame(tick);
  }

  function arm(on) {
    armed = on;
    deathBox.checked = on;
    deathToggle.classList.toggle("on", on);
    if (frame) cancelAnimationFrame(frame);
    frame = null;
    fuse.style.width = "0";
    document.body.classList.remove("dying");
    if (on) {
      lastKeystroke = Date.now();
      frame = requestAnimationFrame(tick);
      say("Armed. Stop for five seconds and it all goes.");
    } else {
      say("");
    }
  }

  deathBox.addEventListener("change", function () { arm(deathBox.checked); });

  /* ---------- editing ---------- */

  var draftTimer = null;

  editor.addEventListener("input", function () {
    lastKeystroke = Date.now();
    paintCount();
    clearTimeout(draftTimer);
    draftTimer = setTimeout(function () {
      store(DRAFT_KEY, JSON.stringify({ h: editor.innerHTML, n: current }));
    }, 700);
  });

  /* ---------- headings: "# ", "## ", "### " at the start of a line ---------- */

  function blockOf(node) {
    while (node && node !== editor) {
      if (node.nodeType === 1 && node.parentNode === editor) return node;
      node = node.parentNode;
    }
    return null;
  }

  function caretRange() {
    var sel = window.getSelection();
    if (!sel || !sel.rangeCount || !sel.isCollapsed) return null;
    return sel.getRangeAt(0);
  }

  editor.addEventListener("beforeinput", function (e) {
    if (e.inputType !== "insertText" || e.data !== " ") return;

    var range = caretRange();
    if (!range) return;

    var before = document.createRange();
    before.selectNodeContents(blockOf(range.startContainer) || editor);
    try { before.setEnd(range.startContainer, range.startOffset); } catch (err) { return; }

    var m = /^(#{1,3})$/.exec(before.toString());
    if (!m) return;

    // The hashes are the instruction, not the text: swallow them and the space.
    e.preventDefault();
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(before);
    document.execCommand("delete");
    document.execCommand("formatBlock", false, "h" + m[1].length);
    lastKeystroke = Date.now();
    paintCount();
  });

  editor.addEventListener("keydown", function (e) {
    if (e.key !== "Enter" || e.shiftKey) return;

    var range = caretRange();
    if (!range) return;
    var block = blockOf(range.startContainer);
    if (!block || !/^H[1-6]$/.test(block.tagName)) return;

    var after = document.createRange();
    after.selectNodeContents(block);
    try { after.setStart(range.startContainer, range.startOffset); } catch (err) { return; }
    if (after.toString().length) return;        // caret is mid-heading, leave it alone

    // Leaving a heading starts ordinary prose, not another heading.
    e.preventDefault();
    var p = document.createElement("p");
    p.appendChild(document.createElement("br"));
    editor.insertBefore(p, block.nextSibling);

    var to = document.createRange();
    to.setStart(p, 0);
    to.collapse(true);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(to);
    lastKeystroke = Date.now();
  });

  editor.addEventListener("paste", function (e) {
    e.preventDefault();
    var text = (e.clipboardData || window.clipboardData).getData("text/plain");
    document.execCommand("insertText", false, text);
  });

  function format(cmd) {
    editor.focus();
    document.execCommand(cmd, false, null);
    lastKeystroke = Date.now();
  }
  document.getElementById("bold").addEventListener("mousedown", function (e) { e.preventDefault(); format("bold"); });
  document.getElementById("italic").addEventListener("mousedown", function (e) { e.preventDefault(); format("italic"); });

  document.addEventListener("keydown", function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") {
      e.preventDefault();
      save();
    }
  });

  /* ---------- saving ---------- */

  function token() {
    var t = recall(TOKEN_KEY);
    if (t) return t;
    t = window.prompt("Save token (one time on this device):");
    if (t) {
      t = t.trim();
      store(TOKEN_KEY, t);
    }
    return t;
  }

  // One shape for every call: resolves to {ok, status, data}, never rejects.
  function api(path, options) {
    var t = token();
    if (!t) return Promise.resolve({ ok: false, status: 0, data: { error: "no token" } });

    options = options || {};
    options.headers = { "Content-Type": "application/json", "Authorization": "Bearer " + t };

    return fetch(API + path, options)
      .then(function (r) {
        return r.json()
          .catch(function () { return { error: "server said " + r.status }; })
          .then(function (data) {
            if (r.status === 401) store(TOKEN_KEY, null);
            return { ok: r.ok, status: r.status, data: data };
          });
      })
      .catch(function () {
        return { ok: false, status: 0, data: { error: "couldn't reach the server" } };
      });
  }

  function save() {
    var md = markdown();
    if (!md) { say("Nothing to save.", "err"); return; }

    var target = current;
    if (armed) arm(false);
    saveBtn.disabled = true;
    say(target ? "Updating…" : "Saving…");

    var payload = target ? { markdown: md, note: target } : { markdown: md };

    api("/save", { method: "POST", body: JSON.stringify(payload) }).then(function (res) {
      saveBtn.disabled = false;
      if (!res.ok) {
        say("Not saved — " + (res.data.error || res.status) + ". Your words are still here.", "err");
        return;
      }
      store(DRAFT_KEY, null);
      if (res.data.updated) {
        // Stay in the entry: editing usually comes in passes.
        say("Updated " + res.data.note + " · " + res.data.words + " words.", "ok");
        return;
      }
      editor.innerHTML = "";
      paintCount();
      say("Saved to Novel as " + res.data.note + " · " + res.data.words + " words.", "ok");
    });
  }

  saveBtn.addEventListener("click", save);

  /* ---------- previous entries ---------- */

  function paintChip() {
    chip.classList.toggle("on", !!current);
    chipName.textContent = current ? "editing " + current : "";
  }

  function leaveEntry() {
    current = null;
    editor.innerHTML = "";
    store(DRAFT_KEY, null);
    paintChip();
    paintCount();
    say("");
    editor.focus();
  }

  function openSheet(on) {
    sheet.classList.toggle("on", !!on);
    if (!on) editor.focus();
  }

  function row(entry) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "entry";

    var when = document.createElement("span");
    when.className = "when";
    when.textContent = (entry.date || entry.note) + (entry.time ? " · " + entry.time : "");
    b.appendChild(when);

    if (entry.edited) {
      var ed = document.createElement("span");
      ed.className = "edited";
      ed.textContent = "edited " + entry.edited;
      b.appendChild(ed);
    }

    var n = document.createElement("span");
    n.className = "n";
    n.textContent = entry.words + (entry.words === 1 ? " word" : " words");
    b.appendChild(n);

    b.addEventListener("click", function () { load(entry.note); });
    return b;
  }

  function listEntries() {
    sheetList.innerHTML = "";
    var loading = document.createElement("div");
    loading.className = "sheet-empty";
    loading.textContent = "Loading…";
    sheetList.appendChild(loading);
    openSheet(true);

    api("/entries").then(function (res) {
      sheetList.innerHTML = "";
      if (!res.ok) {
        loading.textContent = "Couldn't load: " + (res.data.error || res.status);
        sheetList.appendChild(loading);
        return;
      }
      if (!res.data.entries.length) {
        loading.textContent = "Nothing saved yet.";
        sheetList.appendChild(loading);
        return;
      }
      res.data.entries.forEach(function (e) { sheetList.appendChild(row(e)); });
    });
  }

  function load(note) {
    if (!current && words() > 0 &&
        !window.confirm("Replace what's in the box? It hasn't been saved.")) return;

    api("/entry?note=" + encodeURIComponent(note)).then(function (res) {
      if (!res.ok) { say("Couldn't open " + note + " — " + (res.data.error || res.status), "err"); return; }
      if (armed) arm(false);
      current = res.data.note;
      editor.innerHTML = toHtml(res.data.markdown);
      store(DRAFT_KEY, null);
      paintChip();
      paintCount();
      openSheet(false);
      say("Editing " + res.data.note + ". Save writes back to it.");
    });
  }

  document.getElementById("entries").addEventListener("click", listEntries);
  document.getElementById("sheetClose").addEventListener("click", function () { openSheet(false); });
  document.getElementById("chipClose").addEventListener("click", leaveEntry);
  sheet.addEventListener("click", function (e) { if (e.target === sheet) openSheet(false); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && sheet.classList.contains("on")) openSheet(false);
  });

  window.addEventListener("beforeunload", function (e) {
    if (words() > 0) { e.preventDefault(); e.returnValue = ""; }
  });

  /* ---------- start ---------- */

  var draft = recall(DRAFT_KEY);
  if (draft) {
    var saved = null;
    try { saved = JSON.parse(draft); } catch (e) { saved = { h: draft, n: null }; }
    if (saved && saved.h) {
      editor.innerHTML = saved.h;
      current = saved.n || null;
      say(current ? "Unsaved changes to " + current + " restored." : "Unsaved draft restored.");
    }
  }
  paintChip();
  paintCount();
  editor.focus();
})();
</script>
</body>
</html>
