<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Full-bleed background: the manifest declares this icon "maskable", so
       Android may crop it to a circle. Everything meaningful is kept inside
       the central 80% safe zone. -->
  <rect width="512" height="512" fill="#191919"/>
  <g fill="none" stroke="#5fb8a0" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <!-- mic capsule -->
    <rect x="211" y="136" width="90" height="150" rx="45" fill="#5fb8a0" fill-opacity="0.18"/>
    <!-- pickup arc -->
    <path d="M162 256c0 52 42 94 94 94s94-42 94-94"/>
    <!-- stand -->
    <path d="M256 350v42"/>
    <!-- baseline, doubling as the "note" the dictation becomes -->
    <path d="M196 392h120"/>
  </g>
</svg>
