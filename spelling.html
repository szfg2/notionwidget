<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff8e9">
  <meta name="description" content="A gentle, interactive spelling game for little learners.">
  <title>Spell &amp; Play</title>
  <style>
    :root {
      --cream: #fff8e9;
      --paper: #fffefb;
      --navy: #12305b;
      --navy-soft: #31517a;
      --coral: #ff806f;
      --yellow: #ffc928;
      --blue: #58adf6;
      --green: #43bd68;
      --green-dark: #208747;
      --line: #c7d9ea;
      --muted: #6c7d91;
      --shadow: 0 18px 50px rgba(69, 62, 44, .13), 0 3px 8px rgba(69, 62, 44, .08);
      --round: 28px;
      --font: "Arial Rounded MT Bold", "Trebuchet MS", "Segoe UI Rounded", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; background: var(--cream); }

    body {
      min-height: 100svh;
      margin: 0;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 9% 26%, rgba(255, 255, 255, .9) 0 44px, transparent 45px),
        radial-gradient(circle at 92% 40%, rgba(255, 255, 255, .85) 0 55px, transparent 56px),
        var(--cream);
      color: var(--navy);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    button, input { font: inherit; }

    button {
      color: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible, input:focus-visible + span {
      outline: 4px solid rgba(28, 116, 205, .34);
      outline-offset: 4px;
    }

    .app-shell {
      position: relative;
      z-index: 1;
      width: min(1120px, 100%);
      min-height: 100svh;
      margin: 0 auto;
      padding: max(18px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 16px;
    }

    .app-header {
      min-height: 68px;
      display: grid;
      grid-template-columns: minmax(190px, 1fr) auto minmax(190px, 1fr);
      align-items: center;
      gap: 16px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: clamp(1.55rem, 3vw, 2.2rem);
      font-weight: 900;
      letter-spacing: -.04em;
      white-space: nowrap;
    }

    .brand-blocks { display: inline-flex; gap: 2px; }

    .brand-blocks span {
      width: 29px;
      height: 29px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 17px;
      box-shadow: inset 0 -3px 0 rgba(18, 48, 91, .14);
      transform: rotate(-4deg);
    }

    .brand-blocks span:nth-child(1) { background: var(--coral); }
    .brand-blocks span:nth-child(2) { background: var(--yellow); color: var(--navy); transform: rotate(4deg); }

    .stars {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(7px, 1.5vw, 15px);
      min-width: 220px;
    }

    .star {
      width: clamp(29px, 4vw, 43px);
      aspect-ratio: 1;
      color: #e8ddc9;
      filter: drop-shadow(0 2px 0 rgba(64, 45, 17, .09));
      transition: color .25s ease, transform .45s cubic-bezier(.2, .9, .25, 1.45);
    }

    .star.filled { color: var(--yellow); transform: scale(1.08) rotate(-4deg); }

    .parent-access {
      justify-self: end;
      position: relative;
      width: 68px;
      height: 58px;
      border: 3px solid #e3d8c2;
      border-radius: 999px;
      background: rgba(255, 254, 251, .78);
      display: grid;
      place-items: center;
      cursor: pointer;
      overflow: hidden;
      box-shadow: 0 4px 12px rgba(69, 62, 44, .07);
    }

    .parent-access svg { position: relative; z-index: 2; width: 34px; height: 34px; }

    .hold-fill {
      position: absolute;
      z-index: 1;
      inset: auto 0 0;
      height: 0;
      background: #d9f1df;
      transition: height .15s linear;
    }

    .parent-access.holding .hold-fill {
      height: 100%;
      transition: height 1.2s linear;
    }

    .game-wrap {
      display: grid;
      place-items: center;
      min-height: 0;
    }

    .game-card {
      position: relative;
      width: min(840px, 100%);
      background: var(--paper);
      border: 1px solid rgba(208, 196, 169, .38);
      border-radius: var(--round);
      box-shadow: var(--shadow);
      padding: clamp(20px, 3.4vw, 38px) clamp(18px, 5vw, 58px) clamp(18px, 3vw, 30px);
      transition: transform .2s ease;
    }

    .game-card.try-again { animation: gentle-wiggle .5s ease; }

    .prompt-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      justify-items: center;
      gap: clamp(12px, 4vw, 42px);
      min-height: 152px;
      margin-bottom: clamp(12px, 2vw, 20px);
    }

    .word-picture {
      width: clamp(126px, 18vw, 170px);
      aspect-ratio: 1;
      border-radius: 42% 48% 45% 50%;
      background: #fff4d5;
      display: grid;
      place-items: center;
      font-family: "Apple Color Emoji", "Segoe UI Emoji", sans-serif;
      font-size: clamp(76px, 12vw, 118px);
      line-height: 1;
      filter: drop-shadow(0 7px 0 rgba(18, 48, 91, .07));
      transform: rotate(-2deg);
    }

    .listen-group { text-align: center; }

    .listen-button {
      width: clamp(94px, 12vw, 116px);
      aspect-ratio: 1;
      border: 0;
      border-radius: 50%;
      background: var(--blue);
      color: #fff;
      cursor: pointer;
      box-shadow: inset 0 -7px 0 rgba(18, 48, 91, .16), 0 8px 16px rgba(38, 133, 217, .22);
      transition: transform .12s ease, filter .12s ease;
    }

    .listen-button svg { width: 55%; height: 55%; vertical-align: middle; }
    .listen-button:hover { filter: brightness(1.04); }
    .listen-button:active { transform: translateY(4px) scale(.98); }
    .listen-button.speaking { animation: speak-pulse .75s ease infinite alternate; }

    .listen-label {
      display: block;
      margin-top: 9px;
      color: var(--navy);
      font-size: clamp(1rem, 2.4vw, 1.35rem);
      font-weight: 900;
    }

    .letter-slots, .letter-bank {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: clamp(9px, 2.4vw, 20px);
    }

    .letter-slots { min-height: clamp(78px, 12vw, 108px); }

    .letter-slot {
      position: relative;
      flex: 0 1 126px;
      width: min(18vw, 126px);
      aspect-ratio: 1.08;
      border: 3px dashed var(--line);
      border-radius: 22px;
      background: #fbfdff;
      display: grid;
      place-items: center;
      color: var(--navy);
      font-size: clamp(2.6rem, 7vw, 4.7rem);
      font-weight: 900;
      cursor: pointer;
      transition: border-color .16s ease, background .16s ease, transform .16s ease;
    }

    .letter-slot:empty { cursor: default; }
    .letter-slot.filled { border-style: solid; border-color: #b7cde2; background: #f8fbff; }
    .letter-slot.drop-ready { transform: scale(1.05); border-color: var(--blue); background: #eaf6ff; }

    .letter-slot[data-hint]:empty::after {
      content: attr(data-hint);
      color: #d6e2ed;
      font-size: inherit;
      font-weight: 900;
    }

    .letter-bank {
      min-height: clamp(102px, 16vw, 142px);
      margin-top: clamp(12px, 2.2vw, 22px);
    }

    .letter-tile {
      --tile-color: var(--coral);
      flex: 0 1 142px;
      width: min(20vw, 142px);
      aspect-ratio: 1.13;
      border: 0;
      border-radius: 22px;
      background: var(--tile-color);
      color: var(--navy);
      font-size: clamp(3rem, 8vw, 5.2rem);
      font-weight: 900;
      cursor: grab;
      touch-action: none;
      box-shadow: inset 0 -7px 0 rgba(18, 48, 91, .13), 0 7px 12px rgba(18, 48, 91, .11);
      transition: transform .12s ease, opacity .16s ease, filter .12s ease;
    }

    .letter-tile:hover { filter: brightness(1.03); transform: translateY(-2px); }
    .letter-tile:active { cursor: grabbing; transform: translateY(3px); }
    .letter-tile.used { opacity: 0; pointer-events: none; transform: scale(.76); }
    .letter-tile.hint-tile { animation: hint-bounce .58s ease 2; }
    .letter-tile.drag-origin { opacity: .22; }

    .drag-ghost {
      position: fixed;
      z-index: 1000;
      width: 112px;
      height: 100px;
      margin: -50px 0 0 -56px;
      border-radius: 22px;
      display: grid;
      place-items: center;
      color: var(--navy);
      font-size: 4rem;
      font-weight: 900;
      box-shadow: 0 18px 30px rgba(18, 48, 91, .24), inset 0 -7px 0 rgba(18, 48, 91, .13);
      pointer-events: none;
      transform: rotate(3deg) scale(1.07);
    }

    .main-action {
      width: 100%;
      min-height: 66px;
      margin-top: clamp(12px, 2vw, 19px);
      border: 0;
      border-radius: 22px;
      background: var(--green);
      color: #fff;
      font-size: clamp(1.45rem, 3vw, 2rem);
      font-weight: 900;
      cursor: pointer;
      box-shadow: inset 0 -7px 0 var(--green-dark), 0 7px 14px rgba(30, 136, 72, .18);
      transition: transform .12s ease, filter .12s ease, opacity .12s ease;
    }

    .main-action:hover:not(:disabled) { filter: brightness(1.03); }
    .main-action:active:not(:disabled) { transform: translateY(4px); box-shadow: inset 0 -3px 0 var(--green-dark); }
    .main-action:disabled { opacity: .38; cursor: default; box-shadow: inset 0 -5px 0 #8dba99; }

    .hint-button {
      min-height: 46px;
      margin: 10px auto 0;
      padding: 8px 18px;
      border: 2px solid #e2d4b9;
      border-radius: 999px;
      background: #fffaf0;
      color: var(--navy-soft);
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: .98rem;
      font-weight: 900;
      cursor: pointer;
    }

    .hint-button span:first-child { font-size: 1.35rem; }

    .status-message {
      min-height: 24px;
      margin: 8px 0 -2px;
      color: var(--muted);
      text-align: center;
      font-size: .98rem;
      font-weight: 800;
    }

    .status-message.success { color: var(--green-dark); }

    .level-pill {
      justify-self: center;
      min-height: 40px;
      padding: 8px 18px;
      border: 2px solid #dbe7d9;
      border-radius: 999px;
      background: rgba(245, 252, 242, .84);
      color: var(--navy-soft);
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: .92rem;
      font-weight: 900;
    }

    .level-pill svg { width: 20px; height: 20px; color: var(--green); }

    .celebration {
      position: fixed;
      z-index: 50;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      display: none;
    }

    .celebration.on { display: block; }

    .yay-card {
      position: absolute;
      left: 50%;
      top: 48%;
      min-width: min(340px, 82vw);
      padding: 20px 30px;
      border: 4px solid #fff;
      border-radius: 28px;
      background: var(--yellow);
      color: var(--navy);
      text-align: center;
      font-size: clamp(2rem, 7vw, 3.7rem);
      font-weight: 900;
      box-shadow: 0 18px 50px rgba(18, 48, 91, .22);
      animation: yay-in .65s cubic-bezier(.2, .95, .25, 1.3) both;
    }

    .yay-card small { display: block; margin-top: 2px; font-size: .42em; }

    .confetti {
      --fall-x: 0px;
      position: absolute;
      top: -40px;
      width: 14px;
      height: 24px;
      border-radius: 5px;
      animation: confetti-fall 1.7s ease-in forwards;
    }

    dialog {
      width: min(520px, calc(100vw - 28px));
      max-height: min(720px, calc(100svh - 28px));
      overflow: auto;
      border: 0;
      border-radius: 28px;
      background: var(--paper);
      color: var(--navy);
      padding: 0;
      box-shadow: 0 28px 90px rgba(18, 48, 91, .3);
    }

    dialog::backdrop { background: rgba(18, 48, 91, .52); backdrop-filter: blur(4px); }

    .settings-form { padding: clamp(22px, 5vw, 34px); }

    .settings-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; }
    .settings-head h2 { margin: 0; font-size: 1.75rem; letter-spacing: -.03em; }
    .settings-head p { margin: 5px 0 0; color: var(--muted); font-family: system-ui, sans-serif; font-weight: 600; line-height: 1.45; }

    .close-dialog {
      flex: none;
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 50%;
      background: #f1eee7;
      color: var(--navy);
      font-size: 1.55rem;
      cursor: pointer;
    }

    fieldset { margin: 27px 0 22px; padding: 0; border: 0; }
    legend { margin-bottom: 12px; font-size: 1.1rem; font-weight: 900; }

    .level-options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
    .level-option { position: relative; cursor: pointer; }
    .level-option input { position: absolute; opacity: 0; pointer-events: none; }
    .level-option span {
      min-height: 86px;
      padding: 12px 8px;
      border: 3px solid #e3e8ee;
      border-radius: 18px;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 2px;
      text-align: center;
      font-size: .96rem;
      font-weight: 900;
    }
    .level-option small { color: var(--muted); font-family: system-ui, sans-serif; font-weight: 650; }
    .level-option input:checked + span { border-color: var(--blue); background: #edf7ff; }

    .toggle-row {
      min-height: 59px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      border-top: 1px solid #e8e5dd;
      font-family: system-ui, sans-serif;
      font-weight: 750;
      cursor: pointer;
    }

    .toggle-row input { width: 26px; height: 26px; accent-color: var(--green); }

    .save-settings {
      width: 100%;
      min-height: 58px;
      border: 0;
      border-radius: 18px;
      background: var(--navy);
      color: #fff;
      font-size: 1.12rem;
      font-weight: 900;
      cursor: pointer;
    }

    .parent-note {
      margin: 15px 0 0;
      color: var(--muted);
      font-family: system-ui, sans-serif;
      font-size: .82rem;
      font-weight: 600;
      line-height: 1.45;
      text-align: center;
    }

    @keyframes speak-pulse { to { transform: scale(1.06); box-shadow: inset 0 -7px 0 rgba(18, 48, 91, .16), 0 0 0 12px rgba(88, 173, 246, .16); } }
    @keyframes hint-bounce { 45% { transform: translateY(-12px) rotate(-3deg); } }
    @keyframes gentle-wiggle { 25% { transform: translateX(-6px); } 50% { transform: translateX(6px); } 75% { transform: translateX(-3px); } }
    @keyframes yay-in { from { transform: translate(-50%, -50%) scale(.35) rotate(-8deg); opacity: 0; } to { transform: translate(-50%, -50%) scale(1) rotate(0); opacity: 1; } }
    @keyframes confetti-fall { to { transform: translate(var(--fall-x), 110vh) rotate(760deg); } }

    @media (max-width: 700px) {
      .app-shell { padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom)); gap: 10px; }
      .app-header { min-height: 55px; grid-template-columns: 1fr auto; }
      .brand { font-size: 1.42rem; }
      .brand-blocks span { width: 25px; height: 25px; font-size: 14px; }
      .stars { grid-row: 2; grid-column: 1 / -1; min-width: 0; }
      .star { width: 29px; }
      .parent-access { grid-row: 1; grid-column: 2; width: 57px; height: 48px; }
      .game-card { border-radius: 23px; }
      .prompt-row { min-height: 112px; margin-bottom: 6px; }
      .word-picture { width: 112px; font-size: 72px; }
      .listen-button { width: 78px; }
      .listen-label { margin-top: 4px; font-size: .95rem; }
      .letter-slot { width: min(19.5vw, 105px); border-radius: 17px; }
      .letter-tile { width: min(20.5vw, 110px); border-radius: 17px; box-shadow: inset 0 -5px 0 rgba(18, 48, 91, .13), 0 5px 10px rgba(18, 48, 91, .1); }
      .main-action { min-height: 58px; border-radius: 18px; }
      .hint-button { min-height: 42px; margin-top: 9px; }
      .level-pill { min-height: 36px; padding: 6px 14px; font-size: .82rem; }
    }

    @media (max-height: 700px) and (min-width: 620px) {
      .app-shell { gap: 8px; padding-top: 10px; padding-bottom: 10px; }
      .app-header { min-height: 50px; }
      .game-card { padding-top: 16px; padding-bottom: 14px; }
      .prompt-row { min-height: 108px; margin-bottom: 4px; }
      .word-picture { width: 108px; font-size: 72px; }
      .listen-button { width: 78px; }
      .letter-slots { min-height: 76px; }
      .letter-slot { max-width: 92px; }
      .letter-bank { min-height: 82px; margin-top: 10px; }
      .letter-tile { max-width: 104px; }
      .main-action { min-height: 54px; margin-top: 10px; }
      .hint-button { min-height: 38px; padding: 5px 16px; }
      .status-message { margin-top: 5px; }
    }

    @media (max-width: 420px) {
      .brand .brand-text { font-size: 1.24rem; }
      .game-card { padding-left: 13px; padding-right: 13px; }
      .prompt-row { gap: 4px; }
      .letter-slots, .letter-bank { gap: 7px; }
      .level-options { grid-template-columns: 1fr; }
      .level-option span { min-height: 65px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand" aria-label="Spell and Play">
        <span class="brand-blocks" aria-hidden="true"><span>S</span><span>P</span></span>
        <span class="brand-text">Spell &amp; Play</span>
      </div>

      <div class="stars" id="stars" aria-label="0 of 5 stars"></div>

      <button class="parent-access" id="parentButton" type="button" aria-label="Parent settings. Press and hold to open." title="Press and hold for parent settings">
        <span class="hold-fill" aria-hidden="true"></span>
        <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
          <circle cx="18" cy="11" r="6" fill="currentColor"/>
          <path d="M9 43V28c0-7 4-11 9-11s9 4 9 11v15M12 27l-5 9M24 27l5 7" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
          <circle cx="35" cy="24" r="4" fill="currentColor"/>
          <path d="M29 43V34c0-4 2-7 6-7s6 3 6 7v9M31 34l-3 5M39 34l3 5" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
        </svg>
      </button>
    </header>

    <main class="game-wrap">
      <section class="game-card" id="gameCard" aria-label="Spelling activity">
        <div class="prompt-row">
          <div class="word-picture" id="wordPicture" role="img" aria-label="Cat">🐱</div>
          <div class="listen-group">
            <button class="listen-button" id="listenButton" type="button" aria-label="Hear the word">
              <svg viewBox="0 0 64 64" fill="none" aria-hidden="true">
                <path d="M9 25h12L36 13v38L21 39H9V25Z" fill="currentColor"/>
                <path d="M44 23c4 5 4 13 0 18M51 17c8 9 8 21 0 30" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
              </svg>
            </button>
            <span class="listen-label">Tap to hear</span>
          </div>
        </div>

        <div class="letter-slots" id="letterSlots" aria-label="Put the letters here"></div>
        <div class="letter-bank" id="letterBank" aria-label="Letter choices"></div>

        <button class="main-action" id="checkButton" type="button" disabled>Check</button>
        <button class="hint-button" id="hintButton" type="button"><span aria-hidden="true">💡</span><span>Show hint</span></button>
        <p class="status-message" id="statusMessage" aria-live="polite">Tap the letters in order</p>
      </section>
    </main>

    <div class="level-pill" id="levelPill">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m12 2 3 6.1 6.7 1-4.9 4.7 1.2 6.7-6-3.2-6 3.2 1.2-6.7-4.9-4.7 6.7-1L12 2Z"/></svg>
      <span>Little Learner • 3 letters</span>
    </div>
  </div>

  <div class="celebration" id="celebration" aria-hidden="true">
    <div class="yay-card">You did it!<small id="celebrationWord">CAT</small></div>
  </div>

  <dialog id="settingsDialog" aria-labelledby="settingsTitle">
    <form method="dialog" class="settings-form" id="settingsForm">
      <div class="settings-head">
        <div>
          <h2 id="settingsTitle">Grown-up settings</h2>
          <p>Choose a comfortable challenge. Changes stay on this device.</p>
        </div>
        <button class="close-dialog" type="button" id="closeSettings" aria-label="Close settings">×</button>
      </div>

      <fieldset>
        <legend>Word level</legend>
        <div class="level-options">
          <label class="level-option">
            <input type="radio" name="level" value="3">
            <span>Little Learner<small>3 letters</small></span>
          </label>
          <label class="level-option">
            <input type="radio" name="level" value="4">
            <span>Growing Speller<small>4 letters</small></span>
          </label>
          <label class="level-option">
            <input type="radio" name="level" value="mix">
            <span>Mix It Up<small>3–4 letters</small></span>
          </label>
        </div>
      </fieldset>

      <label class="toggle-row"><span>Show faint letter guides</span><input id="guideSetting" type="checkbox"></label>
      <label class="toggle-row"><span>Voice and happy sounds</span><input id="soundSetting" type="checkbox"></label>

      <button class="save-settings" type="submit" value="save">Save &amp; play</button>
      <p class="parent-note">Tip: tap a letter to place it, or drag it into a box. Tap a filled box to return its letter.</p>
    </form>
  </dialog>

  <script>
  (function () {
    "use strict";

    var WORDS = [
      { word: "CAT", emoji: "🐱", label: "Cat", length: 3 },
      { word: "DOG", emoji: "🐶", label: "Dog", length: 3 },
      { word: "SUN", emoji: "☀️", label: "Sun", length: 3 },
      { word: "BUS", emoji: "🚌", label: "Bus", length: 3 },
      { word: "PIG", emoji: "🐷", label: "Pig", length: 3 },
      { word: "CUP", emoji: "🥤", label: "Cup", length: 3 },
      { word: "HAT", emoji: "🎩", label: "Hat", length: 3 },
      { word: "BEE", emoji: "🐝", label: "Bee", length: 3 },
      { word: "FOX", emoji: "🦊", label: "Fox", length: 3 },
      { word: "CAR", emoji: "🚗", label: "Car", length: 3 },
      { word: "BED", emoji: "🛏️", label: "Bed", length: 3 },
      { word: "MAP", emoji: "🗺️", label: "Map", length: 3 },
      { word: "FISH", emoji: "🐟", label: "Fish", length: 4 },
      { word: "DUCK", emoji: "🦆", label: "Duck", length: 4 },
      { word: "LION", emoji: "🦁", label: "Lion", length: 4 },
      { word: "BEAR", emoji: "🐻", label: "Bear", length: 4 },
      { word: "MOON", emoji: "🌙", label: "Moon", length: 4 },
      { word: "STAR", emoji: "⭐", label: "Star", length: 4 },
      { word: "CAKE", emoji: "🎂", label: "Cake", length: 4 },
      { word: "BOAT", emoji: "⛵", label: "Boat", length: 4 },
      { word: "BOOK", emoji: "📕", label: "Book", length: 4 },
      { word: "FROG", emoji: "🐸", label: "Frog", length: 4 },
      { word: "MILK", emoji: "🥛", label: "Milk", length: 4 },
      { word: "TREE", emoji: "🌳", label: "Tree", length: 4 }
    ];

    var TILE_COLORS = ["#ff806f", "#ffc928", "#58adf6", "#76d7a1"];
    var STORE_KEY = "spell-and-play-settings-v1";
    var PROGRESS_KEY = "spell-and-play-progress-v1";
    var settings = readJSON(STORE_KEY, { level: "3", guides: false, sound: true });
    var progress = readJSON(PROGRESS_KEY, { totalWords: 0 });
    var current = null;
    var recentWords = [];
    var placed = [];
    var tiles = [];
    var starCount = 0;
    var solved = false;
    var hintActive = false;
    var hintTimer = 0;
    var audioContext = null;
    var dragState = null;

    var starsEl = document.getElementById("stars");
    var pictureEl = document.getElementById("wordPicture");
    var slotsEl = document.getElementById("letterSlots");
    var bankEl = document.getElementById("letterBank");
    var listenButton = document.getElementById("listenButton");
    var checkButton = document.getElementById("checkButton");
    var hintButton = document.getElementById("hintButton");
    var statusMessage = document.getElementById("statusMessage");
    var gameCard = document.getElementById("gameCard");
    var celebration = document.getElementById("celebration");
    var celebrationWord = document.getElementById("celebrationWord");
    var levelPill = document.getElementById("levelPill").querySelector("span");
    var settingsDialog = document.getElementById("settingsDialog");
    var settingsForm = document.getElementById("settingsForm");
    var parentButton = document.getElementById("parentButton");
    var holdTimer = 0;

    function readJSON(key, fallback) {
      try {
        var value = JSON.parse(localStorage.getItem(key));
        return value && typeof value === "object" ? Object.assign({}, fallback, value) : fallback;
      } catch (error) {
        return fallback;
      }
    }

    function saveJSON(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch (error) {}
    }

    function shuffle(list) {
      var copy = list.slice();
      for (var i = copy.length - 1; i > 0; i -= 1) {
        var j = Math.floor(Math.random() * (i + 1));
        var temp = copy[i];
        copy[i] = copy[j];
        copy[j] = temp;
      }
      return copy;
    }

    function pickWord() {
      var allowed = WORDS.filter(function (entry) {
        return settings.level === "mix" || String(entry.length) === settings.level;
      });
      var fresh = allowed.filter(function (entry) { return recentWords.indexOf(entry.word) === -1; });
      var pool = fresh.length ? fresh : allowed;
      return pool[Math.floor(Math.random() * pool.length)];
    }

    function makeTiles(word) {
      return shuffle(word.split("").map(function (letter, index) {
        return { id: "tile-" + Date.now() + "-" + index, letter: letter, used: false, color: TILE_COLORS[index % TILE_COLORS.length] };
      }));
    }

    function newRound() {
      window.clearTimeout(hintTimer);
      current = pickWord();
      recentWords.push(current.word);
      if (recentWords.length > 4) recentWords.shift();
      placed = new Array(current.word.length).fill(null);
      tiles = makeTiles(current.word);
      solved = false;
      hintActive = false;
      celebration.classList.remove("on");
      celebration.innerHTML = '<div class="yay-card">You did it!<small id="celebrationWord">' + current.word + "</small></div>";
      celebrationWord = celebration.querySelector("small");
      pictureEl.textContent = current.emoji;
      pictureEl.setAttribute("aria-label", current.label);
      checkButton.textContent = "Check";
      checkButton.disabled = true;
      hintButton.disabled = false;
      setStatus("Tap the letters in order", false);
      updateLevelPill();
      render();
    }

    function render() {
      renderStars();
      renderSlots();
      renderTiles();
      checkButton.disabled = !solved && placed.some(function (item) { return !item; });
    }

    function renderStars() {
      starsEl.innerHTML = "";
      for (var i = 0; i < 5; i += 1) {
        var star = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        star.setAttribute("viewBox", "0 0 24 24");
        star.setAttribute("aria-hidden", "true");
        star.classList.add("star");
        if (i < starCount) star.classList.add("filled");
        star.innerHTML = '<path fill="currentColor" d="m12 1.8 3.15 6.39 7.05 1.02-5.1 4.97 1.2 7.02L12 17.89 5.7 21.2l1.2-7.02-5.1-4.97 7.05-1.02L12 1.8Z"/>';
        starsEl.appendChild(star);
      }
      starsEl.setAttribute("aria-label", starCount + " of 5 stars");
    }

    function renderSlots() {
      slotsEl.innerHTML = "";
      placed.forEach(function (item, index) {
        var slot = document.createElement("button");
        slot.type = "button";
        slot.className = "letter-slot" + (item ? " filled" : "");
        slot.dataset.index = String(index);
        slot.setAttribute("aria-label", item ? "Letter " + item.letter + ". Tap to return it." : "Empty letter box " + (index + 1));
        if ((settings.guides || hintActive) && !item) slot.dataset.hint = current.word.charAt(index);
        if (item) slot.textContent = item.letter;
        slot.addEventListener("click", function () { returnTile(index); });
        slotsEl.appendChild(slot);
      });
    }

    function renderTiles() {
      bankEl.innerHTML = "";
      tiles.forEach(function (item) {
        var tile = document.createElement("button");
        tile.type = "button";
        tile.className = "letter-tile" + (item.used ? " used" : "");
        tile.style.setProperty("--tile-color", item.color);
        tile.textContent = item.letter;
        tile.dataset.tileId = item.id;
        tile.setAttribute("aria-label", "Letter " + item.letter);
        tile.setAttribute("aria-pressed", item.used ? "true" : "false");
        tile.disabled = item.used || solved;
        tile.addEventListener("click", function () {
          if (tile.dataset.ignoreClick === "true") {
            tile.dataset.ignoreClick = "false";
            return;
          }
          placeTile(item.id);
        });
        enablePointerDrag(tile, item);
        bankEl.appendChild(tile);
      });
    }

    function firstEmptySlot() {
      return placed.findIndex(function (item) { return !item; });
    }

    function placeTile(tileId, requestedIndex) {
      if (solved) return;
      var tile = tiles.find(function (item) { return item.id === tileId; });
      var slotIndex = typeof requestedIndex === "number" ? requestedIndex : firstEmptySlot();
      if (!tile || tile.used || slotIndex < 0 || placed[slotIndex]) return;
      tile.used = true;
      placed[slotIndex] = tile;
      playPop(slotIndex);
      render();
      if (firstEmptySlot() === -1) setStatus("Ready to check!", false);
    }

    function returnTile(index) {
      if (solved || !placed[index]) return;
      placed[index].used = false;
      placed[index] = null;
      setStatus("Tap the letters in order", false);
      render();
    }

    function resetLetters() {
      placed.forEach(function (item) { if (item) item.used = false; });
      placed = new Array(current.word.length).fill(null);
      render();
    }

    function answer() {
      return placed.map(function (item) { return item ? item.letter : ""; }).join("");
    }

    function checkAnswer() {
      if (solved) {
        if (starCount >= 5) starCount = 0;
        newRound();
        return;
      }
      if (answer() === current.word) celebrateCorrect();
      else gentleRetry();
    }

    function celebrateCorrect() {
      solved = true;
      starCount += 1;
      progress.totalWords = Number(progress.totalWords || 0) + 1;
      saveJSON(PROGRESS_KEY, progress);
      setStatus("Wonderful spelling!", true);
      checkButton.textContent = starCount >= 5 ? "Play again" : "Next word";
      checkButton.disabled = false;
      hintButton.disabled = true;
      renderStars();
      playSuccess();
      speak("Great job! " + current.label + ".");
      showCelebration();
      renderTiles();
    }

    function gentleRetry() {
      setStatus("Almost! Let’s listen and try again.", false);
      gameCard.classList.remove("try-again");
      void gameCard.offsetWidth;
      gameCard.classList.add("try-again");
      playTryAgain();
      speak("Almost. Let's listen again. " + current.label + ".");
      window.setTimeout(function () {
        gameCard.classList.remove("try-again");
        resetLetters();
        showHint();
      }, 720);
    }

    function showHint() {
      if (solved) return;
      window.clearTimeout(hintTimer);
      hintActive = true;
      renderSlots();
      var wantedIndex = firstEmptySlot();
      if (wantedIndex < 0) wantedIndex = 0;
      var wanted = current.word.charAt(wantedIndex);
      var tileEl = Array.prototype.find.call(bankEl.querySelectorAll(".letter-tile"), function (el) {
        var tile = tiles.find(function (item) { return item.id === el.dataset.tileId; });
        return tile && !tile.used && tile.letter === wanted;
      });
      if (tileEl) {
        tileEl.classList.remove("hint-tile");
        void tileEl.offsetWidth;
        tileEl.classList.add("hint-tile");
      }
      speak("Look for " + wanted + ".");
      hintTimer = window.setTimeout(function () {
        hintActive = false;
        renderSlots();
      }, 3000);
    }

    function setStatus(text, success) {
      statusMessage.textContent = text;
      statusMessage.classList.toggle("success", !!success);
    }

    function updateLevelPill() {
      if (settings.level === "4") levelPill.textContent = "Growing Speller • 4 letters";
      else if (settings.level === "mix") levelPill.textContent = "Mix It Up • 3–4 letters";
      else levelPill.textContent = "Little Learner • 3 letters";
    }

    function showCelebration() {
      celebration.classList.add("on");
      var colors = ["#ff806f", "#ffc928", "#58adf6", "#43bd68", "#8e74e8"];
      for (var i = 0; i < 30; i += 1) {
        var piece = document.createElement("span");
        piece.className = "confetti";
        piece.style.left = Math.round(Math.random() * 100) + "%";
        piece.style.background = colors[i % colors.length];
        piece.style.animationDelay = Math.random() * .35 + "s";
        piece.style.setProperty("--fall-x", Math.round(Math.random() * 180 - 90) + "px");
        celebration.appendChild(piece);
      }
      window.setTimeout(function () { celebration.classList.remove("on"); }, 1750);
    }

    function getAudioContext() {
      if (!settings.sound) return null;
      var AudioCtor = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtor) return null;
      if (!audioContext) audioContext = new AudioCtor();
      if (audioContext.state === "suspended") audioContext.resume();
      return audioContext;
    }

    function tone(frequency, duration, delay, volume) {
      var context = getAudioContext();
      if (!context) return;
      var oscillator = context.createOscillator();
      var gain = context.createGain();
      var start = context.currentTime + (delay || 0);
      oscillator.type = "sine";
      oscillator.frequency.setValueAtTime(frequency, start);
      gain.gain.setValueAtTime(.0001, start);
      gain.gain.exponentialRampToValueAtTime(volume || .12, start + .015);
      gain.gain.exponentialRampToValueAtTime(.0001, start + duration);
      oscillator.connect(gain);
      gain.connect(context.destination);
      oscillator.start(start);
      oscillator.stop(start + duration + .03);
    }

    function playPop(index) { tone(330 + index * 65, .16, 0, .09); }
    function playTryAgain() { tone(300, .18, 0, .08); tone(260, .2, .16, .07); }
    function playSuccess() { tone(523, .32, 0, .11); tone(659, .34, .11, .11); tone(784, .48, .22, .12); }

    function speak(text) {
      if (!settings.sound || !("speechSynthesis" in window)) return;
      try {
        window.speechSynthesis.cancel();
        var utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = .78;
        utterance.pitch = 1.08;
        utterance.volume = 1;
        var voices = window.speechSynthesis.getVoices();
        var english = voices.find(function (voice) { return /^en(-|_)/i.test(voice.lang) && /female|samantha|ava|zira/i.test(voice.name); }) || voices.find(function (voice) { return /^en(-|_)/i.test(voice.lang); });
        if (english) utterance.voice = english;
        listenButton.classList.add("speaking");
        utterance.onend = function () { listenButton.classList.remove("speaking"); };
        utterance.onerror = function () { listenButton.classList.remove("speaking"); };
        window.speechSynthesis.speak(utterance);
      } catch (error) {
        listenButton.classList.remove("speaking");
      }
    }

    function speakWord() {
      playPop(1);
      speak("Can you spell " + current.label + "? " + current.label + ".");
    }

    function enablePointerDrag(element, item) {
      element.addEventListener("pointerdown", function (event) {
        if (event.button !== 0 || item.used || solved) return;
        dragState = { id: item.id, pointerId: event.pointerId, startX: event.clientX, startY: event.clientY, dragging: false, origin: element, ghost: null };
        try { element.setPointerCapture(event.pointerId); } catch (error) {}
      });

      element.addEventListener("pointermove", function (event) {
        if (!dragState || dragState.pointerId !== event.pointerId) return;
        var distance = Math.hypot(event.clientX - dragState.startX, event.clientY - dragState.startY);
        if (!dragState.dragging && distance > 9) {
          dragState.dragging = true;
          element.classList.add("drag-origin");
          var ghost = document.createElement("div");
          ghost.className = "drag-ghost";
          ghost.textContent = item.letter;
          ghost.style.background = item.color;
          document.body.appendChild(ghost);
          dragState.ghost = ghost;
        }
        if (dragState.dragging) {
          event.preventDefault();
          dragState.ghost.style.left = event.clientX + "px";
          dragState.ghost.style.top = event.clientY + "px";
          markDropTarget(event.clientX, event.clientY);
        }
      });

      element.addEventListener("pointerup", finishDrag);
      element.addEventListener("pointercancel", cancelDrag);
    }

    function markDropTarget(x, y) {
      slotsEl.querySelectorAll(".letter-slot").forEach(function (slot) { slot.classList.remove("drop-ready"); });
      var target = document.elementFromPoint(x, y);
      var slot = target && target.closest ? target.closest(".letter-slot") : null;
      if (slot && !placed[Number(slot.dataset.index)]) slot.classList.add("drop-ready");
    }

    function finishDrag(event) {
      if (!dragState || dragState.pointerId !== event.pointerId) return;
      var state = dragState;
      var wasDragging = state.dragging;
      var target = wasDragging ? document.elementFromPoint(event.clientX, event.clientY) : null;
      var slot = target && target.closest ? target.closest(".letter-slot") : null;
      cleanupDrag();
      if (wasDragging) {
        state.origin.dataset.ignoreClick = "true";
        if (slot) placeTile(state.id, Number(slot.dataset.index));
      }
    }

    function cancelDrag() { if (dragState) cleanupDrag(); }

    function cleanupDrag() {
      if (!dragState) return;
      dragState.origin.classList.remove("drag-origin");
      if (dragState.ghost) dragState.ghost.remove();
      slotsEl.querySelectorAll(".letter-slot").forEach(function (slot) { slot.classList.remove("drop-ready"); });
      dragState = null;
    }

    function openSettings() {
      parentButton.classList.remove("holding");
      settingsForm.querySelector('input[name="level"][value="' + settings.level + '"]').checked = true;
      document.getElementById("guideSetting").checked = !!settings.guides;
      document.getElementById("soundSetting").checked = !!settings.sound;
      if (typeof settingsDialog.showModal === "function") settingsDialog.showModal();
      else settingsDialog.setAttribute("open", "");
    }

    function beginParentHold(event) {
      if (event.pointerType === "mouse" && event.button !== 0) return;
      window.clearTimeout(holdTimer);
      parentButton.classList.add("holding");
      holdTimer = window.setTimeout(openSettings, 1200);
    }

    function cancelParentHold() {
      window.clearTimeout(holdTimer);
      parentButton.classList.remove("holding");
    }

    parentButton.addEventListener("pointerdown", beginParentHold);
    parentButton.addEventListener("pointerup", cancelParentHold);
    parentButton.addEventListener("pointerleave", cancelParentHold);
    parentButton.addEventListener("pointercancel", cancelParentHold);
    parentButton.addEventListener("keydown", function (event) {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        openSettings();
      }
    });

    document.getElementById("closeSettings").addEventListener("click", function () { settingsDialog.close(); });
    settingsForm.addEventListener("submit", function (event) {
      event.preventDefault();
      var chosen = settingsForm.querySelector('input[name="level"]:checked');
      settings.level = chosen ? chosen.value : "3";
      settings.guides = document.getElementById("guideSetting").checked;
      settings.sound = document.getElementById("soundSetting").checked;
      saveJSON(STORE_KEY, settings);
      settingsDialog.close();
      starCount = 0;
      newRound();
    });

    listenButton.addEventListener("click", speakWord);
    hintButton.addEventListener("click", showHint);
    checkButton.addEventListener("click", checkAnswer);
    document.addEventListener("visibilitychange", function () {
      if (document.hidden && "speechSynthesis" in window) window.speechSynthesis.cancel();
    });

    newRound();
  }());
  </script>
</body>
</html>
